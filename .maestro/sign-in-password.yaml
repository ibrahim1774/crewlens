appId: com.ibrahim1774.crewlens
name: Sign in with email and password (wrong password first, then the right one)
# Needs an existing account. Pass EMAIL and PASSWORD with -e; never commit a real password.
# A brand-new account without a company continues into setup-after-sign-in.yaml.
env:
  EMAIL: "ibrahim3709+maestro@gmail.com"
  PASSWORD: ""
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "welcome-sign-in"
    timeout: 20000
- tapOn:
    id: "welcome-sign-in"
- extendedWaitUntil:
    visible: "Welcome back.*"
    timeout: 15000
- assertVisible: "Continue with Google"
- tapOn:
    id: "email"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
- inputText: "definitely-wrong-1"
- tapOn:
    id: "password-submit"
- extendedWaitUntil:
    visible: ".*email and password don.t match.*"
    timeout: 15000
- takeScreenshot: sign-in-wrong-password
- tapOn: "OK"
# Retyping into a secure field after an error is unreliable under XCTest, so start a fresh screen.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "welcome-sign-in"
    timeout: 20000
- tapOn:
    id: "welcome-sign-in"
- extendedWaitUntil:
    visible: "Welcome back.*"
    timeout: 15000
- tapOn:
    id: "email"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn:
    id: "password-submit"
- extendedWaitUntil:
    notVisible: "Welcome back.*"
    timeout: 30000
- takeScreenshot: sign-in-done
# iOS offers to save the password in the Passwords app (that is how it is remembered next time).
- tapOn:
    text: "Not Now"
    optional: true
