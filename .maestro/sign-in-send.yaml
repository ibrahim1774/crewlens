appId: com.ibrahim1774.crewlens
name: Email sign-in step 1, request a code
# Run after onboarding.yaml or intro.yaml left the app on the sign-in screen, or from the welcome screen.
env:
  EMAIL: "ibrahim3709@gmail.com"
---
- launchApp
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Returning users take Sign in on the welcome screen.
- runFlow:
    when:
      visible:
        id: "welcome-sign-in"
    commands:
      - tapOn:
          id: "welcome-sign-in"
- extendedWaitUntil:
    visible: "Welcome back.*"
    timeout: 15000
# Phone is the default; email is one tap away.
- tapOn:
    id: "use-email"
- tapOn:
    id: "email"
- eraseText
- inputText: ${EMAIL}
# Dismissing the keyboard can already submit the form on iOS, so only tap if the button is still there.
- runFlow:
    when:
      visible:
        id: "send-code"
    commands:
      - tapOn:
          id: "send-code"
- extendedWaitUntil:
    visible: "6-digit code"
    timeout: 20000
- assertVisible: "Verify code"
- takeScreenshot: sign-in-code-requested
