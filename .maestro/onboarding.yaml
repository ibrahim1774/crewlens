appId: com.ibrahim1774.crewlens
name: Crew Lens onboarding, questions first, the account last
env:
  DEV_URL: "exp+crewlens://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082"
---
- launchApp:
    clearState: true
# Development-client builds land on the launcher; open the project and dismiss the first-run menu.
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
# First launch lands on welcome; Get started shows the benefits, then sign-in.
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 30000
- takeScreenshot: 01-welcome
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "Why crews use.*"
    timeout: 10000
- takeScreenshot: 01b-benefits
# Continue makes a guest account; the questions, company and plan hang off it.
- tapOn:
    id: "benefits-continue"
- extendedWaitUntil:
    visible: "Who is shooting?"
    timeout: 20000
- tapOn:
    id: "name"
- inputText: "Maestro Owner"
- tapOn:
    id: "name-continue"
- tapOn:
    id: "trade-roofing"
- tapOn:
    id: "company"
- inputText: "Maestro Test Co"
- takeScreenshot: 02-company
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Set it up for how you work"
    timeout: 20000
- tapOn:
    id: "role-owner"
- tapOn:
    id: "crew-6-15"
- tapOn:
    id: "tailor-continue"
- tapOn:
    id: "home-camera-roll"
- tapOn:
    id: "headache-proving-the-work-got-done"
- takeScreenshot: 03-pains
- tapOn:
    id: "pains-continue"
# The tracking prompt comes before the plan; camera and location wait until after it.
- tapOn:
    text: "Ask App Not to Track"
    optional: true
# With Superwall off, the plan table shows; a crew of 6-15 starts on the Crew plan.
- extendedWaitUntil:
    visible: "Continue with Crew"
    timeout: 15000
- takeScreenshot: 05-plan
- tapOn:
    id: "plan-continue"
- extendedWaitUntil:
    visible: "Save your account"
    timeout: 15000
- takeScreenshot: 06-save
- assertNotVisible: "Joining a crew.*"
# Quitting here and reopening returns to the plan step, never into the app.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "plan-continue"
    timeout: 30000
