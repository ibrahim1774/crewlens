appId: com.ibrahim1774.crewlens
name: Crew Lens intro tour runs ten screens and lands on sign-in
env:
  DEV_URL: "exp+crewlens://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082"
---
- launchApp:
    clearState: true
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "welcome-tour"
    timeout: 30000
- tapOn:
    id: "welcome-tour"
- extendedWaitUntil:
    visible: "Your camera roll is not a job record."
    timeout: 10000
- assertVisible: "NO JOB · NO TIME · NO PROOF"
- takeScreenshot: intro-01
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Every photo gets the stamp."
    timeout: 5000
- takeScreenshot: intro-02
- swipe:
    direction: LEFT
    duration: 300
- extendedWaitUntil:
    visible: "Filed to the right job before you lower the phone."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Before. During. After. In order."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "One link for the whole job."
    timeout: 5000
- takeScreenshot: intro-05
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Win the argument before it starts."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Your whole crew, one record."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Works where the signal does not."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Archive. Never delete."
    timeout: 5000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Start the record."
    timeout: 5000
- assertNotVisible:
    id: "intro-skip"
- takeScreenshot: intro-10
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- takeScreenshot: intro-sign-in
# A relaunch lands on welcome, never inside the tour.
- launchApp
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 30000
- assertNotVisible: "Your camera roll is not a job record."
