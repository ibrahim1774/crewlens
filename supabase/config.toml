# Supabase project config kept in the repo so function settings are not CLI flags someone forgets.
[functions.share]
# The share page is anonymous. The function validates the share token itself and uses the service role.
verify_jwt = false

[functions.superwall-webhook]
# Superwall calls this with a bearer secret in the Authorization header; there is no user JWT.
verify_jwt = false

[functions.delete-account]
# The function verifies the caller's session itself (auth.getUser) and deletes only that user.
verify_jwt = false
